name: ARM Docker Image CI

on:
  push:
    branches: 
      - "main"
    paths:
      - 'backend/**'   # 监控文件夹及其子文件夹内的所有文件
      - '.github/workflows/build_docker_image.yml'
    tags: 
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ops

jobs:
  build-arm:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ARM Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend           # 直接指定 backend 目录作为构建上下文
          file: ./Dockerfile           # 使用根目录下的 Dockerfile
          platforms: linux/arm64       # 目标平台设置为 ARM64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}  # 使用 commit SHA 作为版本标签
